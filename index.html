<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjalori i Programimit</title>
  <meta name="description" content="Fjalor shqip–anglisht i termave të programimit për fillestarët në Shqipëri dhe Kosovë.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Set the theme before anything paints, so dark mode never "flashes" white -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipToContent">Kalo te përmbajtja</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">{ë}</span>
        <span class="brand-name" data-i18n="siteName">Fjalori i Programimit</span>
      </a>

      <div class="header-actions">
        <button id="lang-toggle" class="lang-toggle" type="button">
          <span data-lang="sq">SQ</span><span data-lang="en">EN</span>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <p class="loading">…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer">Bërë me kujdes për studentët në Shqipëri dhe Kosovë.</p>
    </div>
  </footer>
</body>
</html>
