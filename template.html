<!doctype html>
<html lang="sq">
<head>
  <!-- This is a TEMPLATE. scripts/build.mjs fills in the {{…}} parts for every page. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  {{meta}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      // Old links like /#/term/api → /term/api (the part after # never reaches the server)
      if (location.hash.indexOf("#/") === 0) location.replace(location.hash.slice(1));

      // Set the theme before anything paints, so dark mode never "flashes" white
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Font Awesome Free icons (https://fontawesome.com, icons CC BY 4.0) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>

  <!-- Vercel Web Analytics: counts page views (no cookies, no personal data) -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipToContent">Kalo te përmbajtja</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">{ë}</span>
        <span class="brand-name" data-i18n="siteName">Fjalori i Programimit</span>
      </a>

      <div class="header-actions">
        <a class="header-link" href="/flashcards" data-i18n="flashcards">Kartat</a>
        <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch to English">
          <span data-lang="sq" class="active">SQ</span><span data-lang="en">EN</span>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Ndrysho pamjen">
          <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
          <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
{{main}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer">Bërë me kujdes për studentët në Shqipëri dhe Kosovë.</p>
      <p class="credit"><span data-i18n="voiceCredit">Zëri shqip:</span> <a href="https://folsh.ai" target="_blank" rel="noopener">folsh.ai</a> · Edon Sekiraqa (CC0)</p>
    </div>
  </footer>
</body>
</html>
